modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "worldguard-logo.png"

[[mixins]]
config = "worldguard.mixins.json"

[[mixins]]
config = "worldguard.dqm.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "worldedit"
type = "required"
versionRange = "[7.4.5,7.5)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "luckperms"
type = "optional"
versionRange = "[5.5,)"
ordering = "AFTER"
side = "SERVER"
