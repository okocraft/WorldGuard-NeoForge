plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven {
        url = 'https://maven.enginehub.org/repo/'
        metadataSources {
            mavenPom()
            artifact()
            ignoreGradleMetadataRedirection()
        }
    }
    mavenCentral()
}

neoForge {
    version = neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        worldguard { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation 'com.sk89q.worldedit:worldedit-neoforge-mc26.2:7.4.5'
    implementation 'com.sk89q.worldguard:worldguard-core:7.0.19'
    implementation 'com.sk89q.worldguard.worldguard-libs:core:7.0.19'
    jarJar(implementation('org.flywaydb:flyway-core:3.0')) {
        version { strictly '3.0' }
    }
    jarJar(implementation('org.yaml:snakeyaml:2.0')) {
        version { strictly '2.0' }
    }
    jarJar(implementation('org.xerial:sqlite-jdbc:3.53.0.0')) {
        version { strictly '[3.53.0.0,4.0)'; prefer '3.53.0.0' }
    }
    compileOnly 'net.luckperms:api:5.5'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation 'net.luckperms:api:5.5'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replacements = [minecraft_version_range: minecraft_version_range,
                        neo_version_range: neo_version_range,
                        loader_version_range: loader_version_range,
                        mod_id: mod_id, mod_name: mod_name,
                        mod_license: mod_license, mod_version: mod_version,
                        mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties replacements
    expand replacements
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full' }
}

// Embed the official region engine in the mod module, sharing WorldEdit's types.
configurations { embeddedEngine { transitive = false } }
dependencies {
    embeddedEngine 'com.sk89q.worldguard:worldguard-core:7.0.19'
    embeddedEngine 'com.sk89q.worldguard.worldguard-libs:core:7.0.19'
}
tasks.named('jar', Jar) {
    from({ configurations.embeddedEngine.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourceSets {
    testmod {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('testmodJar', Jar) {
    from sourceSets.testmod.output
    archiveFileName = 'worldguard-test.jar'
    destinationDirectory = layout.buildDirectory.dir('testmods')
}
tasks.named('check') { dependsOn tasks.named('testmodJar') }
